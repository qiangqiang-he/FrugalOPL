# Qwen3-8B PG-OPSD preparation for RTX5000-3, physical GPUs 4-7.
# Independent experiment profile; the original Qwen3-1.7B preset is unchanged.
extends: shared_batched_4GPU.yaml

eval_interval: 10

run:
  name: pg_opsd_qwen3_8b_openthoughts_math30k_b256n1_lr2e6_clip01_shared4_k4_20261106
  storage:
    output_root: /data/heqiangqiang/outputs/FrugalOPL
  redis:
    url: redis://127.0.0.1:16379/0
    key_prefix: frugalopl_pg_opsd_qwen3_8b_b256n1_lr2e6_clip01_shared4_k4_20261106
  runtime:
    minimum_free_gpu_memory_gb: 3
  policy:
    model_name_or_path: /data/heqiangqiang/models/Qwen3-8B-nvme-20261106

worker_defaults:
  Teacher:
    gpu_ids: [4, 5, 6, 7]

controller:
  train_prompt_batch_size: 256
  data:
    max_prompt_length: 2096
    eval:
      - name: amc23
        path: data/AMC-2023.json

actor:
  gpu_ids: [4, 5, 6, 7]
  engine:
    max_model_len: 10288
    gpu_memory_utilization: 0.60
    gpu_memory_budget_gb: 40.0
    max_num_seqs: 32
    max_num_batched_tokens: 4096
    enable_chunked_prefill: true
    enforce_eager: false
    compilation_config:
      cudagraph_capture_sizes: [1, 2, 4, 8, 16, 32]
  evaluation:
    generation:
      temperature: 0.6
      top_p: 0.95
      max_response_length: 8192

learner:
  gpu_ids: [4, 5, 6, 7]
  distributed:
    master_port: 29748
  execution:
    clip_grad_norm: 0.1
  optimizer:
    lr: 2.0e-6

algorithm:
  training_sampling:
    temperature: 1.0
    top_p: 1.0
    max_tokens: 4096
    n: 1
