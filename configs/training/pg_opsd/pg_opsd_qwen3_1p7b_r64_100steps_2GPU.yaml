# Complete training configuration; retains the original experiment settings.
eval_interval: 20
save_ckpt_interval: 20
save_question_accuracy: false

run:
  name: pg_opsd_qwen3_1p7b_openthoughts_math30k_r64_100steps_2GPU
  group: pg-opsd
  seed: 42
  prompts:
    train: MATH_PROMPT
    evaluation: MATH_PROMPT
  storage:
    output_root: outputs
    lora_adapter_root: null
  swanlab:
    enabled: true
    project: FrugalOPL-Official
    workspace: qhe
    mode: online
  redis:
    url: redis://localhost:6379/0
    key_prefix: frugalopl
    clear_run_keys_on_start: true
    serializer: pickle
  runtime:
    process_start_method: spawn
    minimum_free_gpu_memory_gb: 3
    pause_on_cuda_oom_only: true
    restart:
      enabled: true
      worker_restart_delay_sec: 5
      manager_poll_interval_sec: 2
  policy:
    dtype: bfloat16
    lora:
      enabled: true
      rank: 64
      alpha: 128
      dropout: 0.0
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    model_name_or_path: ~/projects/models/Qwen3-1.7B

worker_defaults:
  Teacher:
    max_sequence_length: 10496
    forward:
      chunk_size: 512
      max_batches_per_turn: 4
    gpu_ids: [1]

controller:
  queue_poll_timeout_sec: 1
  data:
    max_prompt_length: 2048
    max_response_length: 4096
    train:
      name: openthoughts_math30k
      path: data/openthoughts_math30k.json
    eval:
    - name: aime24
      path: data/AIME-2024.json
    - name: amc23
      path: data/AMC-2023.json
  max_inflight_batches: 4
  max_steps: 100
  train_prompt_batch_size: 32

actor:
  engine:
    max_model_len: 18432
    gpu_memory_utilization: 0.8
    tensor_parallel_size: 1
    enforce_eager: false
    collect_timeout_sec: 0.03
    logprobs:
      default: 0
      max: 16
  lora:
    enabled: true
    max_rank: 64
  evaluation:
    enabled: true
    before_training: true
    max_examples: null
    generation:
      temperature: 0.7
      top_p: 0.95
      max_response_length: 16384
    rollouts_per_batch: 64
    rollouts_per_prompt: 8
    save_rollouts: false
  gpu_ids: [0]

learner:
  max_sequence_length: 8192
  distributed:
    backend: nccl
    master_addr: 127.0.0.1
    master_port: 29573
    timeout_sec: 3600
  execution:
    gradient_checkpointing: true
    clip_grad_norm: 1.0
  optimizer:
    type: adamw
    lr: 1.0e-05
    betas: [0.9, 0.999]
    eps: 1.0e-08
    weight_decay: 0.0
  scheduler:
    type: constant
  checkpoint:
    max_keep: 4
  gpu_ids: [1]
pipeline:
- id: controller
  class: Controller
- id: actor
  class: Actor
  plugin_hook: collect_actor_signals
  cpu_offload: false
- id: learner
  class: Learner
  plugin_hook: collect_learner_signals
  objective_fn: compute_objective
  cpu_offload: false

algorithm:
  plugin: PGOPSDPlugin
  algo_name: pg_opsd
  enable_thinking: false
  training_sampling:
    temperature: 1.0
    top_p: 1.0
    max_tokens: 4096
    n: 4
  advantage_clip: 10.0
