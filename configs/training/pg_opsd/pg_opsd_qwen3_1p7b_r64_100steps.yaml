# PG-OPSD counterpart of the Qwen3-4B-Instruct-2507 -> 1.7B PG-OPD profile.
# The solution-conditioned Teacher is the Learner's fixed 1.7B base with LoRA
# disabled. There is no Teacher process, model allocation, or evolving target.

extends: ../../common/framework_1GPU.yaml

pipeline:
  - id: controller
    class: Controller

  - id: actor
    class: Actor
    plugin_hook: collect_actor_signals
    cpu_offload: false

  - id: learner
    class: Learner
    plugin_hook: collect_learner_signals
    objective_fn: compute_objective
    cpu_offload: false

run:
  name: pg_opsd_qwen3_1p7b_dapo13k_with_solution_r64_100steps
  group: pg-opsd
  seed: 42
  swanlab:
    enabled: true
  policy:
    model_name_or_path: ~/projects/models/Qwen3-1.7B
    dtype: bfloat16
    lora:
      enabled: true
      rank: 64
      alpha: 128
      dropout: 0.0
      target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
        - gate_proj
        - up_proj
        - down_proj
  prompts:
    train: MATH_PROMPT
    evaluation: MATH_PROMPT

controller:
  max_steps: 100
  train_prompt_batch_size: 32
  max_inflight_batches: 4
  data:
    train:
      name: dapo13k_with_solution
      path: data/dapo13k_with_solution.json
    eval:
      - name: aime24
        path: data/AIME-2024.json
      - name: amc23
        path: data/AMC-2023.json
    max_prompt_length: 2048
    max_response_length: 4096

actor:
  gpu_ids: [0]
  engine:
    max_model_len: 18432
    gpu_memory_utilization: 0.30
    tensor_parallel_size: 1
    enforce_eager: false
    max_batches_per_turn: 4
    collect_timeout_sec: 0.03
    logprobs:
      default: 0
      max: 16
  lora:
    enabled: true
    max_rank: 64
  evaluation:
    enabled: true
    before_training: true
    interval_steps: 20
    rollouts_per_batch: 64
    rollouts_per_prompt: 8
    save_rollouts: false
    generation:
      temperature: 0.7
      top_p: 0.95
      max_response_length: 16384

learner:
  gpu_ids: [0]
  # Reference prompts include the complete solution. Reserve more context
  # than the Student's 2048 + 4096 token budget; oversized prompts fail rather
  # than silently discarding privileged information.
  max_sequence_length: 18432
  execution:
    forward_chunk_size: 512
    max_batches_per_turn: 4
    gradient_checkpointing: true
    clip_grad_norm: 1.0
  optimizer:
    type: adamw
    lr: 1.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.0
  scheduler:
    type: constant
  checkpoint:
    max_keep: 4

algorithm:
  plugin: PGOPSDPlugin
  algo_name: pg_opsd
  enable_thinking: false
  training_sampling:
    temperature: 1.0
    top_p: 1.0
    max_tokens: 4096
    n: 4
  # As in PG-OPD, clamp detached Teacher-minus-fresh-Student token advantages.
  advantage_clip: 10.0
