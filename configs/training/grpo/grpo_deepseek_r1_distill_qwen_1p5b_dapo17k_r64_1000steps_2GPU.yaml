# Dual-4090 GRPO profile: Actor on GPU 0, Learner on GPU 1.
extends: ../../common/framework_2GPU.yaml

pipeline:
  - id: controller
    class: Controller
  - id: actor
    class: Actor
    plugin_hook: collect_actor_signals
    cpu_offload: false
  - id: learner
    class: Learner
    plugin_hook: collect_learner_signals
    objective_fn: compute_objective
    cpu_offload: false

run:
  name: grpo_deepseek_r1_distill_qwen_1p5b_dapo17k_r64_4096_b32n4_1000steps_2GPU
  group: grpo
  swanlab:
    enabled: true
  policy:
    model_name_or_path: ~/projects/models/DeepSeek-R1-Distill-Qwen-1.5B
    # LoRA rank 64 / alpha 128 and bfloat16 inherit from the framework.

controller:
  max_steps: 1000
  # One logical update contains 32 questions x 4 rollouts = 128 responses.
  train_prompt_batch_size: 32
  max_inflight_batches: 4
  data:
    train:
      name: dapo_17k
      path: data/DAPO-17k.json
    eval:
      name: amc23
      path: data/AMC-2023.json
    max_prompt_length: 2048
    max_response_length: 4096

actor:
  gpu_ids: [0]
  engine:
    # 16384 evaluation response tokens + 2048 prompt/template tokens.
    max_model_len: 18432
    # Dedicated Actor memory budget (0.80) inherits from common.
    max_batches_per_turn: 2
  evaluation:
    enabled: true
    before_training: true
    interval_steps: 100
    rollouts_per_batch: 64
    # The primary evaluation metric is Avg@8.
    rollouts_per_prompt: 8
    save_rollouts: false
    generation:
      temperature: 0.6
      top_p: 0.95
      max_response_length: 16384

learner:
  gpu_ids: [1]
  # Training prompt + response + 256 tokens for packed answer probes.
  max_sequence_length: 6400
  execution:
    # Gradient checkpointing inherits from common.
    max_batches_per_turn: 2
    clip_grad_norm: 1.0
  optimizer:
    lr: 2.0e-6

algorithm:
  plugin: GRPOPlugin
  algo_name: grpo
  # DeepSeek's native chat template fixes the <think> prefix; no mode switch.
  training_sampling:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4096
    n: 4
  clip_ratio: 0.2
  kl_coef: 0.0
  answer_probe_threshold: 0.4
