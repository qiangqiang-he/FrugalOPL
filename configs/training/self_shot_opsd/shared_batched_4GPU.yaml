# Identical KL-OPSD numerical/training recipe; only Teacher context changes.
extends: ../kl_opsd/shared_batched_4GPU.yaml

run:
  group: self-shot-opsd
  storage:
    output_root: /data/heqiangqiang/outputs/FrugalOPL
  runtime:
    minimum_free_gpu_memory_gb: 3
  redis:
    url: redis://127.0.0.1:16479/0

worker_defaults:
  Teacher:
    gpu_ids: [0, 1, 2, 3]

actor:
  gpu_ids: [0, 1, 2, 3]
  engine:
    gpu_memory_utilization: 0.52
    gpu_memory_budget_gb: 45.0

learner:
  gpu_ids: [0, 1, 2, 3]

algorithm:
  plugin: SelfShotOPSDPlugin
  algo_name: self_shot_opsd
  self_shot_format: prompt
