run:
  group: Gemma4-E2B-it
  policy:
    model_name_or_path: google/gemma-4-E2B-it
    model_loader: multimodal_lm
    lora:
      target_modules: 'model\.language_model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))'
actor:
  engine:
    max_num_seqs: 8
    kv_cache_memory_bytes: 25769803776
    compilation_config:
      cudagraph_capture_sizes: [1, 2, 4, 8]
    hf_overrides:
      architectures: [Gemma4ForCausalLM]
algorithm:
  enable_thinking: false
