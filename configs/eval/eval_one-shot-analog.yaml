# One-shot delta: use each record's paired analog as the worked example.
# This intentionally has no ``extends`` so it can layer cleanly over any
# model-specific evaluation configuration.

run:
  prompts:
    evaluation: MATH_ONESHOT_MESSAGES

actor:
  evaluation:
    datasets:
      aime_2024:
        path: data/AIME-2024-one-shot-analog.json
        prompt: evaluation
        max_examples: null
