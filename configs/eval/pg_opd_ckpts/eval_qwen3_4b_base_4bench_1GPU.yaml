# Phase C: untrained Qwen3-4B base model evaluated on AIME24/25/26 and
# MATH-500 with the campaign's shared No-thinking Avg@8 preset.
extends: common_pg_opd_ckpts_1GPU.yaml

run:
  name: eval_4b_base_4bench
  output_dir: outputs/pg_opd_ckpt_eval/qwen3_4b/base_4bench
  policy:
    model_name_or_path: ~/projects/models/Qwen3-4B

actor:
  lora:
    path: null
  evaluation:
    datasets:
      aime24:
        path: data/AIME-2024.json
        prompt: evaluation
        max_examples: null
      aime25:
        path: data/AIME-2025.json
        prompt: evaluation
        max_examples: null
      aime26:
        path: data/AIME-2026.json
        prompt: evaluation
        max_examples: null
      math500:
        path: data/MATH500.json
        prompt: evaluation
        max_examples: null
